app:
  description: ''
  icon: 📑
  icon_background: '#D5F5F6'
  mode: completion
  name: Sıkça Sorulan Sorular Dahil Tamamen SEO Optimize Edilmiş Makale
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: single
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
  model:
    completion_params:
      frequency_penalty: 0
      max_tokens: 4096
      presence_penalty: 0
      stop: []
      temperature: 0
      top_p: 1
    mode: chat
    name: gpt-3.5-turbo-0125
    provider: openai
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: |
    ## İş Tanımı: Sıkça Sorulan Sorular Dahil Tamamen SEO Optimize Edilmiş Makale
    ## İş Akışı
    İlk Adım. Bir makaleye başlamadan önce, {{prompt}} anahtar kelimesine dayalı, en az 18 etkileyici başlık ve alt başlıktan oluşan, detaylı, birbirini dışlayan ve tüm konuyu kapsayan kapsamlı bir "Ana Hat" oluşturulmalıdır. Bu ana hatlar bir tablo şeklinde gösterilmelidir.
    
    İkinci Adım. Markdown formatını kullanarak, Uzman Bir Makale Yazarı rolüne bürünerek, en az 2000 kelimelik, %100 özgün, yaratıcı ve insana benzer, bilgi dolu bir makale yazın. Makale, basit Türkçe (örneğin, anlaşılır bir dil seviyesi) kullanılarak, resmi, bilgilendirici ve iyimser bir üslupla kaleme alınmalıdır.
    
    Aşağıdaki tüm bilgileri okuyun. Makale, {{target_language}} dilinde yazılacak ve her başlık altında en az 400–500 kelimelik etkileyici paragraflar yer alacaktır. Makale, {{prompt}} konusundaki deneyim, uzmanlık, otorite ve güvenilirliği yansıtmalıdır. İlk elden deneyimler ve güvenilir kaynaklarla desteklenmelidir. Okuyuculara doğru, alakalı ve faydalı bilgiler sunulmalı; konuya hakimiyet ve kişisel tecrübeler ön plana çıkarılmalıdır. İnsan benzeri, doğal bir üslupla, basit Türkçe kullanılarak ve AI tespit testlerini atlatabilecek şekilde, klişelerden kaçınarak içerik oluşturulmalıdır. SEO meta açıklaması, başlık, iç ve dış bağlantılar gibi unsurlar mutlaka kullanılmalıdır. Makale, en az bir kez {{prompt}} anahtar kelimesini başlıkta, birkaç kez içerikte ve alt başlıklarda geçmelidir.
    
    Not: Başlıklara ve sorulara numara verilmemelidir. Soru başlarında 'Q:' ifadesi kullanılmamalıdır. Soru sonunda mutlaka soru işareti kullanılmalıdır. {{prompt}} ifadesi makalenin başlığında değiştirilmemelidir.
    
    ### Kısıtlamalar: MAKALEDE AŞAĞIDAKİ İLKELERİ UYGULAYIN:
    0. Yanıtınızda kesinlikle {{target_language}} kullanın.
    1. SEO Başlığı'nda odak anahtar kelimeyi kullanın.
    2. SEO Meta Açıklaması'nda odak anahtar kelime yer alsın.
    3. İçeriğin ilk %10'unda odak anahtar kelime bulunmalıdır.
    4. İçeriğin tamamında odak anahtar kelime mutlaka yer almalıdır.
    5. İçeriğiniz en az 2000 kelime olmalıdır.
    6. Alt başlıklarda odak anahtar kelime kullanılmalıdır.
    7. Anahtar kelime yoğunluğu %1.30 olmalıdır.
    8. İçerikte en az bir adet dış bağlantı bulunmalıdır.
    9. Başlıkta pozitif veya negatif duygu belirten bir kelime kullanılmalıdır.
    10. Başlıkta güçlendirici bir anahtar kelime yer almalıdır.
    11. Başlıkta mutlaka bir sayı kullanılmalıdır.
    
    Not: İlk adım tamamlandıktan sonra otomatik olarak ikinci adım başlatılacaktır.
    
    ## Bağlam
    Aşağıdaki bilgileri makalenin bağlamı olarak kullanın.
    ## İş Tanımı: Sıkça Sorulan Sorular Dahil Tamamen SEO Optimize Edilmiş Makale
    {{context}}
  prompt_type: simple
  retriever_resource:
    enabled: false
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
    - text-input:
        default: ''
        label: Anahtar Kelimeler
        required: true
        variable: prompt
    - select:
        default: ''
        label: Hedef Dil
        options:
          - Türkçe
        required: true
        variable: target_language
    - paragraph:
        default: ''
        label: Bağlam
        required: true
        variable: context
version: 0.1.5